services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.production
    command:
      - streamlit
      - run
      - bybit_operator_ui.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    env_file:
      - .env
    environment:
      DEFAULT_DB_PATH: /app/data/trading_bot.db
    volumes:
      - trade_data:/app/data
      - trade_reports:/app/reports
      - trade_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  research-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.production
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8502
      - --server.baseUrlPath=research
      - --server.headless=true
      - --browser.gatherUsageStats=false
    env_file:
      - .env
    environment:
      DEFAULT_DB_PATH: /app/data/trading_bot.db
    volumes:
      - trade_data:/app/data
      - trade_reports:/app/reports
      - trade_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/research/_stcore/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  mobile-api:
    build:
      context: .
      dockerfile: Dockerfile.production
    command:
      - uvicorn
      - mobile_api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    env_file:
      - .env
    environment:
      MOBILE_API_DB_PATH: /app/data/trading_bot.db
      MOBILE_DASHBOARD_URL: https://${TRADE_DOMAIN}
      MOBILE_PUSH_ENABLED: "true"
    volumes:
      - trade_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    depends_on:
      dashboard:
        condition: service_healthy
      research-dashboard:
        condition: service_healthy
      mobile-api:
        condition: service_healthy
    environment:
      TRADE_DOMAIN: ${TRADE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  trade_data:
  trade_reports:
  trade_logs:
  caddy_data:
  caddy_config:
