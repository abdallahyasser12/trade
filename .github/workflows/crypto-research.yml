name: Crypto walk-forward research

# Two modes, one registered entry point.
#
#   research  the chronological walk-forward protocol and its promotion verdict
#   sizing    one backtest per deployment level, measuring whether a signal's
#             risk-adjusted quality survives being given more capital
#
# Both live here rather than in separate files because GitHub only registers a
# workflow_dispatch workflow that exists on the default branch, so a new file
# on a feature branch cannot be dispatched until it merges. A second entry
# point that cannot be run is worse than a mode flag on one that can.
#
# Manual only. Runs the chronological walk-forward protocol against real
# Alpaca market data and reports what a round trip costs and whether the
# strategy beat simply holding the benchmark.
#
# Market data only: the script never constructs a broker and can never place
# an order. Paper credentials are used purely to authenticate the data API.
#
# Required repository secrets:
#   ALPACA_PAPER_API_KEY
#   ALPACA_PAPER_SECRET_KEY

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated Alpaca USD crypto pairs"
        default: "BTC/USD,ETH/USD,SOL/USD"
      benchmark:
        description: "Buy-and-hold comparator (must be in the universe)"
        default: "BTC/USD"
      timeframe:
        description: "Bar size — widen this if cost per trade is high"
        type: choice
        options: ["1Hour", "4Hour", "1Day", "15Min"]
        default: "1Hour"
      engine:
        description: "Decision engine. Members run solo (1 candidate, no search) as the council baseline."
        type: choice
        options: ["base", "ensemble", "cross", "council", "breadth", "meanrev", "volregime"]
        default: "base"
      start:
        description: "First research date (UTC, YYYY-MM-DD)"
        default: "2023-01-01"
      end:
        description: "Last research date (UTC, blank = yesterday)"
        default: ""
      # Replaced the max_cost_to_risk input, which was left at its 1.0 default
      # on every run to date; the script still applies that default, it is
      # simply no longer overridable from CI. Inputs are capped at ten.
      mode:
        description: "research = walk-forward verdict; sizing = deployment ladder"
        type: choice
        options: ["research", "sizing"]
        default: "research"
      train_bars:
        description: "Training bars per fold"
        default: "1500"
      test_bars:
        description: "Out-of-sample bars per fold"
        default: "500"
      # workflow_dispatch allows at most 10 inputs. --min-train-trades held the
      # last slot and was set to 5 on every run; this toggle is needed on most
      # of them, because one late listing silently truncates the whole universe.
      drop_late_listings:
        description: "Drop the symbols that most truncate the aligned window (reports each drop)"
        type: boolean
        default: false

concurrency:
  # Keyed on the engine as well as the ref, so a council run and the member
  # runs it is being compared against can proceed in parallel. Keyed on the ref
  # alone they cancelled each other, which made the head-to-head impossible to
  # collect in one pass.
  group: crypto-research-${{ github.ref }}-${{ inputs.engine }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    # The regime ensemble recomputes benchmark context per candidate
    # evaluation, so wide-grid multi-fold runs on 4Hour bars need hours,
    # not minutes.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Verify credentials are configured
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: |
          if [ -z "$ALPACA_PAPER_API_KEY" ] || [ -z "$ALPACA_PAPER_SECRET_KEY" ]; then
            echo "::error::Set the ALPACA_PAPER_API_KEY and ALPACA_PAPER_SECRET_KEY repository secrets."
            exit 1
          fi

      - name: Run the sizing study
        id: sizing
        if: inputs.mode == 'sizing'
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: |
          set +e
          python scripts/run_sizing_study.py \
            --symbols "${{ inputs.symbols }}" \
            --benchmark "${{ inputs.benchmark }}" \
            --timeframe "${{ inputs.timeframe }}" \
            --engine "${{ inputs.engine }}" \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            ${{ inputs.drop_late_listings && '--drop-late-listings' || '' }} \
            --json-out verdict.json \
            2>&1 | tee report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Run walk-forward research
        id: research
        if: inputs.mode == 'research'
        env:
          ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: |
          set +e
          python scripts/run_crypto_research.py \
            --symbols "${{ inputs.symbols }}" \
            --benchmark "${{ inputs.benchmark }}" \
            --timeframe "${{ inputs.timeframe }}" \
            --engine "${{ inputs.engine }}" \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --train-bars "${{ inputs.train_bars }}" \
            --test-bars "${{ inputs.test_bars }}" \
            --min-train-trades 5 \
            ${{ inputs.drop_late_listings && '--drop-late-listings' || '' }} \
            --json-out verdict.json \
            2>&1 | tee report.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish the verdict
        if: always()
        run: |
          {
            if [ "${{ inputs.mode }}" = "sizing" ]; then
              echo "## Sizing study"
              echo
              echo "Read the **Sharpe** column, not the return column. Sizing scales a signal"
              echo "rather than improving one, so the highest risk level shows the highest"
              echo "return whenever expectancy is positive at all. A flat Sharpe as risk rises"
              echo "means the edge was merely under-deployed; a decaying one means more capital"
              echo "makes it worse. This mode cannot promote anything."
              echo
              echo '```'
              cat report.txt
              echo '```'
              exit 0
            fi
            echo "## Crypto walk-forward verdict"
            echo
            case "${{ steps.research.outputs.code }}" in
              0) echo "**PASS** — eligible for controlled *paper* testing only. This does not unlock live trading." ;;
              1) echo "**FAIL** — do not promote this configuration. A failure is information: the right response is a different timeframe, universe, or cost structure, never a looser gate." ;;
              *) echo "**Could not complete** — see the log (credentials, data, or configuration)." ;;
            esac
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-research-verdict
          path: |
            report.txt
            verdict.json
          if-no-files-found: warn

      # A promotion FAIL (exit 1) is a legitimate research outcome and must not
      # look like a broken pipeline. Only a run that could not complete fails.
      # A promotion FAIL (exit 1) is a legitimate research outcome. The sizing
      # study has no promotion verdict at all, so any non-zero exit is a real
      # failure there.
      - name: Fail only when the run could not complete
        if: |
          (inputs.mode == 'research' && steps.research.outputs.code != '0' && steps.research.outputs.code != '1')
          || (inputs.mode == 'sizing' && steps.sizing.outputs.code != '0')
        run: exit 1
