name: Python CI

# Hermetic CI only. No trading credentials are configured and no test is allowed to
# place an economic Demo or Live order. The exact same acceptance runner is usable
# locally when GitHub-hosted runner allocation is unavailable.

on:
  push:
    branches: ["**"]
    paths:
      - "**.py"
      - "requirements.txt"
      - "requirements-mobile-api.txt"
      - "docker-compose.production.yml"
      - "Caddyfile"
      - ".env.example"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - "requirements-mobile-api.txt"
      - "docker-compose.production.yml"
      - "Caddyfile"
      - ".env.example"
      - ".github/workflows/python-ci.yml"

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-mobile-api.txt

      - name: Run repository acceptance
        run: python scripts/run_bybit_acceptance.py

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-acceptance-py${{ matrix.python-version }}
          path: |
            reports/bybit_acceptance_*.json
            reports/bybit_acceptance_*.md
          if-no-files-found: warn
          retention-days: 14
