name: Python CI

# Hermetic CI only. No trading credentials are configured and no test is allowed to
# place an economic Demo or Live order.

on:
  push:
    branches: ["**"]
    paths:
      - "**.py"
      - "requirements.txt"
      - "requirements-mobile-api.txt"
      - "docker-compose.production.yml"
      - "Caddyfile"
      - ".env.example"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - "requirements-mobile-api.txt"
      - "docker-compose.production.yml"
      - "Caddyfile"
      - ".env.example"
      - ".github/workflows/python-ci.yml"

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-mobile-api.txt

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Bybit Spot / dashboard safety contract
        run: |
          python -m pytest -q \
            tests/test_bybit_spot.py \
            tests/test_bybit_state.py \
            tests/test_bybit_market_data.py \
            tests/test_bybit_management.py \
            tests/test_bybit_burnin.py \
            tests/test_bybit_operator_control.py \
            tests/test_bybit_security_contract.py \
            tests/test_bybit_chaos.py

      - name: Full Alpaca Quant Desk mobile and Bybit regression suite
        run: python -m pytest -q --durations=10

      - name: Confirm no credential-shaped literal is committed
        run: |
          # Alpaca key ids are PK/AK followed by uppercase alphanumerics.
          if git grep -nIE '\b(PK|AK)[A-Z0-9]{16,}\b' -- . ':(exclude).github/workflows/python-ci.yml'; then
            echo "::error::A credential-shaped literal is committed. Rotate the key and remove it."
            exit 1
          fi
          # Private env files are forbidden even if someone bypasses .gitignore.
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is tracked. Remove it and rotate exposed credentials."
            exit 1
          fi
          echo "No committed credential-shaped literal or tracked .env found."
