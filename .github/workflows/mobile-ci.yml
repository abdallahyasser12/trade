name: Mobile production CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - "mobile_api.py"
      - "mobile_push.py"
      - "requirements-mobile-api.txt"
      - "tests/test_mobile_api.py"
      - "tests/test_mobile_push.py"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "mobile_api.py"
      - "mobile_push.py"
      - "requirements-mobile-api.txt"

jobs:
  python-mobile-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-mobile-api.txt
      - run: python -m pytest -q tests/test_mobile_api.py tests/test_mobile_push.py
      - run: python -m compileall mobile_api.py mobile_push.py

  expo-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run doctor
