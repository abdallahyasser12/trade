name: Market-wide Equity CI

on:
  pull_request:
    paths:
      - "equity_market_data.py"
      - "equity_marketwide_engine.py"
      - "quant/equity_marketwide.py"
      - "scripts/run_marketwide_equity_runtime.py"
      - "tests/test_equity_marketwide*.py"
      - ".github/workflows/marketwide-equity-ci.yml"
  push:
    branches: ["feature/marketwide-equity-opportunity-engine"]

concurrency:
  group: marketwide-equity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-mobile-api.txt
      - name: Compile market-wide production modules
        run: |
          python -m py_compile \
            equity_market_data.py \
            equity_marketwide_engine.py \
            quant/equity_marketwide.py \
            scripts/run_marketwide_equity_runtime.py \
            tests/test_equity_marketwide.py
      - name: Run market-wide regression tests
        run: python -m pytest -q tests/test_equity_marketwide.py
